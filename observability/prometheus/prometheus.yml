# Prometheus: scrapes the gateway and the six services every 15s. The targets are the service
# names, which are the same under docker-compose and Kubernetes, so one file serves both.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: ordersphere
    metrics_path: /actuator/prometheus
    # /actuator/prometheus only answers the shared scrape token (METRICS_SCRAPE_TOKEN): the API
    # gateway routes to every service, so the endpoint can't be open. The container's start
    # command writes the token to this file.
    authorization:
      credentials_file: /prometheus/scrape-token
    static_configs:
      - targets:
          - ordersphere-gateway:8080
          - auth-service:8081
          - ordersphere-orders:8082
          - inventory-service:8083
          - payment-service:8084
          - shipping-service:8085
          - notification-service:8086
    relabel_configs:
      # "service" as in the logs: the host part of the target, e.g. "ordersphere-orders".
      - source_labels: [__address__]
        regex: '([^:]+):\d+'
        target_label: service
