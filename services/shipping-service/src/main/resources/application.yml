server:
  port: 8085

spring:
  application:
    name: shipping-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:shipping_db}
    username: ${DB_USERNAME:ordersphere}
    password: ${DB_PASSWORD:ordersphere}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:ordersphere}
    password: ${RABBITMQ_PASSWORD:ordersphere}
    listener:
      simple:
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000ms

jwt:
  secret: ${JWT_SECRET:dev-only-secret-key-change-me-before-any-real-deployment}
  expiration-millis: ${JWT_EXPIRATION_MILLIS:3600000}

shipping:
  progress:
    sweep-interval-ms: ${SHIPPING_SWEEP_INTERVAL_MS:5000}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true
