server:
  port: 8082

spring:
  application:
    name: ordersphere-orders
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:orders_db}
    username: ${DB_USERNAME:ordersphere}
    password: ${DB_PASSWORD:ordersphere}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:ordersphere}
    password: ${RABBITMQ_PASSWORD:ordersphere}
    listener:
      simple:
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000ms

jwt:
  # Tokens are verified with auth-service's public keys (RS256); nothing here can sign one.
  jwks-uri: ${JWT_JWKS_URI:http://localhost:8081/auth/.well-known/jwks.json}

orders:
  auth:
    # Client credentials orders uses to get its SERVICE token from auth-service (POST /auth/token).
    client-id: ${ORDERS_CLIENT_ID:orders-service}
    client-secret: ${ORDERS_CLIENT_SECRET:dev-orders-client-secret}
  saga:
    sweep-interval-ms: ${ORDERS_SAGA_SWEEP_INTERVAL_MS:5000}
  rest-client:
    connect-timeout-ms: ${ORDERS_REST_CLIENT_CONNECT_TIMEOUT_MS:2000}
    read-timeout-ms: ${ORDERS_REST_CLIENT_READ_TIMEOUT_MS:5000}

resilience4j:
  circuitbreaker:
    configs:
      default:
        register-health-indicator: true
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 15s
        permitted-number-of-calls-in-half-open-state: 5
        automatic-transition-from-open-to-half-open-enabled: true
        # A downstream 4xx is a rejected request, not an outage - see DownstreamClientErrorPredicate.
        ignore-exception-predicate: com.ordersphere.orders.config.DownstreamClientErrorPredicate
    instances:
      inventory-service:
        base-config: default
        record-exceptions:
          - com.ordersphere.orders.exception.InventoryReservationException
      payment-service:
        base-config: default
        wait-duration-in-open-state: 20s
        record-exceptions:
          - com.ordersphere.orders.exception.PaymentInitiationException
      shipping-service:
        base-config: default
        record-exceptions:
          - com.ordersphere.orders.exception.ShipmentCreationException
          - com.ordersphere.orders.exception.ShipmentLookupException

management:
  endpoints:
    web:
      exposure:
        include: health,circuitbreakers,circuitbreakerevents
  endpoint:
    health:
      probes:
        enabled: true
  health:
    circuitbreakers:
      enabled: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true
