server:
  port: 8082

spring:
  application:
    name: ordersphere-orders
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:orders_db}
    username: ${DB_USERNAME:ordersphere}
    password: ${DB_PASSWORD:ordersphere}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:ordersphere}
    password: ${RABBITMQ_PASSWORD:ordersphere}
    listener:
      simple:
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000ms

jwt:
  secret: ${JWT_SECRET:dev-only-secret-key-change-me-before-any-real-deployment}
  expiration-millis: ${JWT_EXPIRATION_MILLIS:3600000}

orders:
  saga:
    sweep-interval-ms: ${ORDERS_SAGA_SWEEP_INTERVAL_MS:5000}
  rest-client:
    connect-timeout-ms: ${ORDERS_REST_CLIENT_CONNECT_TIMEOUT_MS:2000}
    read-timeout-ms: ${ORDERS_REST_CLIENT_READ_TIMEOUT_MS:5000}

resilience4j:
  circuitbreaker:
    configs:
      default:
        register-health-indicator: true
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 15s
        permitted-number-of-calls-in-half-open-state: 5
        automatic-transition-from-open-to-half-open-enabled: true
    instances:
      inventory-service:
        base-config: default
        record-exceptions:
          - com.ordersphere.orders.exception.InventoryReservationException
      payment-service:
        base-config: default
        wait-duration-in-open-state: 20s
        record-exceptions:
          - com.ordersphere.orders.exception.PaymentInitiationException
      shipping-service:
        base-config: default
        record-exceptions:
          - com.ordersphere.orders.exception.ShipmentCreationException
          - com.ordersphere.orders.exception.ShipmentLookupException

management:
  endpoints:
    web:
      exposure:
        include: health,circuitbreakers,circuitbreakerevents
  health:
    circuitbreakers:
      enabled: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true
