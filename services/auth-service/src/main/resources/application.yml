server:
  port: 8081

spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:auth_db}
    username: ${DB_USERNAME:ordersphere}
    password: ${DB_PASSWORD:ordersphere}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:ordersphere}
    password: ${RABBITMQ_PASSWORD:ordersphere}
    listener:
      simple:
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000ms

jwt:
  # Access-token lifetime: short, because an issued access token stays valid until it expires.
  # Sessions continue via refresh tokens (auth.refresh-token-ttl).
  expiration-millis: ${JWT_EXPIRATION_MILLIS:900000}
  signing:
    # Optional RSA key pair (PEM or base64 DER). If unset, a key pair is generated on first start
    # and stored in the signing_keys table.
    private-key: ${JWT_PRIVATE_KEY:}
    public-key: ${JWT_PUBLIC_KEY:}
    key-id: ${JWT_KEY_ID:configured}

auth:
  # Lifetime of a refresh token (a session idle this long must log in again).
  refresh-token-ttl: ${AUTH_REFRESH_TOKEN_TTL:P30D}
  # Lifetime of SERVICE-role tokens issued via client credentials (POST /auth/token).
  service-token-ttl: ${AUTH_SERVICE_TOKEN_TTL:PT5M}
  # Services allowed to obtain a SERVICE token: auth.clients.<client-id>.secret
  clients:
    orders-service:
      secret: ${ORDERS_CLIENT_SECRET:dev-orders-client-secret}

admin:
  bootstrap:
    username: ${ADMIN_BOOTSTRAP_USERNAME:admin}
    password: ${ADMIN_BOOTSTRAP_PASSWORD:admin123}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true
