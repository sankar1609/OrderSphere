server:
  port: 8084

spring:
  application:
    name: payment-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:payment_db}
    username: ${DB_USERNAME:ordersphere}
    password: ${DB_PASSWORD:ordersphere}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:ordersphere}
    password: ${RABBITMQ_PASSWORD:ordersphere}
    listener:
      simple:
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000ms

jwt:
  secret: ${JWT_SECRET:dev-only-secret-key-change-me-before-any-real-deployment}
  expiration-millis: ${JWT_EXPIRATION_MILLIS:3600000}

payment:
  processing:
    # How often PENDING payments are reconciled with the provider and refunds are settled.
    sweep-interval-ms: ${PAYMENT_SWEEP_INTERVAL_MS:5000}
  gateway:
    # Merchant API of the payment provider (the dummy-payment-gateway in development).
    base-url: ${PAYMENT_GATEWAY_URL:http://localhost:8087}
    api-key: ${PAYMENT_GATEWAY_API_KEY:dpg_test_secret_key}
    webhook-secret: ${PAYMENT_GATEWAY_WEBHOOK_SECRET:dpg_test_webhook_secret}
  checkout:
    # Where the provider sends the customer's browser after paying/cancelling (the Web UI).
    return-url: ${PAYMENT_RETURN_URL:http://localhost:5173/}
    # Where the provider POSTs checkout outcomes (must be reachable from the provider).
    webhook-url: ${PAYMENT_WEBHOOK_URL:http://localhost:8084/payments/webhooks/gateway}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true
