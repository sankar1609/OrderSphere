server:
  port: 8084

spring:
  application:
    name: payment-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:payment_db}
    username: ${DB_USERNAME:ordersphere}
    password: ${DB_PASSWORD:ordersphere}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:ordersphere}
    password: ${RABBITMQ_PASSWORD:ordersphere}
    listener:
      simple:
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000ms

jwt:
  # Tokens are verified with auth-service's public keys (RS256); nothing here can sign one.
  jwks-uri: ${JWT_JWKS_URI:http://localhost:8081/auth/.well-known/jwks.json}

payment:
  processing:
    # How often PENDING payments are reconciled with the provider and refunds are settled.
    sweep-interval-ms: ${PAYMENT_SWEEP_INTERVAL_MS:5000}
  gateway:
    # Merchant API of the payment provider (the dummy-payment-gateway in development).
    base-url: ${PAYMENT_GATEWAY_URL:http://localhost:8087}
    api-key: ${PAYMENT_GATEWAY_API_KEY:dpg_test_secret_key}
    webhook-secret: ${PAYMENT_GATEWAY_WEBHOOK_SECRET:dpg_test_webhook_secret}
  checkout:
    # Where the provider sends the customer's browser after paying/cancelling (the Web UI).
    return-url: ${PAYMENT_RETURN_URL:http://localhost:5173/}
    # Where the provider POSTs checkout outcomes (must be reachable from the provider).
    webhook-url: ${PAYMENT_WEBHOOK_URL:http://localhost:8084/payments/webhooks/gateway}


management:
  tracing:
    # Every request traced in dev; lower in production (TRACING_SAMPLING_PROBABILITY).
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      # Jaeger's OTLP/HTTP receiver (docker-compose sets OTLP_TRACING_ENDPOINT).
      endpoint: ${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

ordersphere:
  openapi:
    # Endpoints that don't need a Bearer token (see SecurityConfig); the spec marks them as open.
    public-paths: /payments/webhooks/gateway
