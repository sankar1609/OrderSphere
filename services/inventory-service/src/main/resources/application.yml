server:
  port: 8083

spring:
  application:
    name: inventory-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:inventory_db}
    username: ${DB_USERNAME:ordersphere}
    password: ${DB_PASSWORD:ordersphere}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  data:
    redis:
      # Catalog cache only (see CatalogCache). Short timeouts: the cache is optional, so a slow
      # Redis must not slow the catalog down.
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 500ms
      connect-timeout: 500ms
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:ordersphere}
    password: ${RABBITMQ_PASSWORD:ordersphere}
    listener:
      simple:
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000ms

jwt:
  # Tokens are verified with auth-service's public keys (RS256); nothing here can sign one.
  jwks-uri: ${JWT_JWKS_URI:http://localhost:8081/auth/.well-known/jwks.json}

inventory:
  reservation:
    hold-ttl-minutes: ${RESERVATION_HOLD_TTL_MINUTES:15}
    expiry-sweep-interval-ms: ${RESERVATION_EXPIRY_SWEEP_INTERVAL_MS:60000}
  catalog-cache:
    # The product catalog (list and single products) is served from Redis. Off = always read the
    # database (the load test's baseline, and a kill switch).
    enabled: ${CATALOG_CACHE_ENABLED:true}
    # Safety net for a missed eviction; every product change evicts right after it commits.
    ttl: ${CATALOG_CACHE_TTL:PT30S}


management:
  tracing:
    # Every request traced in dev; lower in production (TRACING_SAMPLING_PROBABILITY).
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      # Jaeger's OTLP/HTTP receiver (docker-compose sets OTLP_TRACING_ENDPOINT).
      endpoint: ${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
  metrics:
    # Scraped by Prometheus at /actuator/prometheus, which needs the scrape token
    # (METRICS_SCRAPE_TOKEN) - the gateway routes to every service, so it must not be open.
    tags:
      application: ${spring.application.name}
    distribution:
      # Latency buckets, so dashboards and alerts can compute percentiles.
      percentiles-histogram:
        http.server.requests: true
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  health:
    redis:
      # The cache is optional (it fails open): Redis being down doesn't make this service unhealthy.
      enabled: false

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true
