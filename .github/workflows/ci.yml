name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (mvn verify)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Runs every module's unit and Testcontainers integration tests (Docker is available on
      # ubuntu-latest runners) plus the Spotless format check bound to the verify phase.
      - name: Build and test
        run: mvn -B -ntp verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: services/*/target/surefire-reports/
          retention-days: 7

  web-ui:
    name: Web UI (build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web-ui
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web-ui/package-lock.json

      - run: npm ci
      - run: npm run build

  k8s:
    name: Kubernetes manifests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KUBECONFORM_VERSION: v0.6.7
    steps:
      - uses: actions/checkout@v5

      - name: Postgres init script matches docker-compose's
        run: diff docker/postgres-init/01-init-databases.sql k8s/base/infra/postgres-init.sql

      # kubectl (with built-in kustomize) is preinstalled on ubuntu-latest runners.
      - name: Render the docker-desktop overlay
        run: kubectl kustomize k8s/overlays/docker-desktop > rendered.yaml

      - name: Validate against the Kubernetes schemas
        run: |
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" | tar xz kubeconform
          ./kubeconform -strict -summary -kubernetes-version 1.30.0 rendered.yaml
