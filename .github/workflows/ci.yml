name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

# Push runs and PR runs never share a group: right after a merge GitHub can start a PR run whose
# group would otherwise collide with the base branch's and cancel the merge commit's run. Only PR
# runs are cancelled by a newer push to the PR; every master/develop commit gets a full run.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  backend:
    name: Backend (mvn verify)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Runs every module's unit and Testcontainers integration tests (Docker is available on
      # ubuntu-latest runners) plus the Spotless format check bound to the verify phase.
      - name: Build and test
        run: mvn -B -ntp verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: services/*/target/surefire-reports/
          retention-days: 7

  web-ui:
    name: Web UI (build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web-ui
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web-ui/package-lock.json

      - run: npm ci
      - run: npm run build

  k8s:
    name: Kubernetes manifests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KUBECONFORM_VERSION: v0.6.7
    steps:
      - uses: actions/checkout@v5

      # kustomize can't read outside k8s/, so these are copies of the docker-compose originals.
      - name: Copied config matches docker-compose's
        run: |
          diff docker/postgres-init/01-init-databases.sql k8s/base/infra/postgres-init.sql
          diff observability/loki/loki.yaml k8s/base/observability/files/loki.yaml
          diff observability/alloy/config.k8s.alloy k8s/base/observability/files/config.k8s.alloy
          diff observability/grafana/provisioning/datasources/datasources.yaml k8s/base/observability/files/datasources.yaml
          diff observability/grafana/provisioning/dashboards/dashboards.yaml k8s/base/observability/files/dashboards.yaml
          diff observability/grafana/provisioning/dashboards/ordersphere-logs.json k8s/base/observability/files/ordersphere-logs.json

      # kubectl (with built-in kustomize) is preinstalled on ubuntu-latest runners.
      - name: Render the docker-desktop overlay
        run: kubectl kustomize k8s/overlays/docker-desktop > rendered.yaml

      - name: Validate against the Kubernetes schemas
        run: |
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" | tar xz kubeconform
          ./kubeconform -strict -summary -kubernetes-version 1.30.0 rendered.yaml
