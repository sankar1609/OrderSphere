services:
  postgres:
    image: postgres:16
    container_name: ordersphere-postgres
    environment:
      POSTGRES_USER: ordersphere
      POSTGRES_PASSWORD: ordersphere
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: ordersphere-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ordersphere
      RABBITMQ_DEFAULT_PASS: ordersphere
    ports:
      - "5672:5672"
      - "15672:15672"

  # Rate-limit counters for the API gateway (RequestRateLimiter). Not published to the host.
  redis:
    image: redis:7-alpine
    container_name: ordersphere-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # Distributed tracing: every service exports spans over OTLP; UI at http://localhost:16686.
  jaeger:
    image: jaegertracing/all-in-one:1.57
    container_name: ordersphere-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
      - "4318:4318"

  service-registry:
    build:
      context: .
      dockerfile: services/service-registry/Dockerfile
    container_name: ordersphere-service-registry
    ports:
      - "8761:8761"

  ordersphere-gateway:
    build:
      context: .
      dockerfile: services/ordersphere-gateway/Dockerfile
    container_name: ordersphere-gateway
    ports:
      - "8080:8080"
    environment:
      OTLP_TRACING_ENDPOINT: http://jaeger:4318/v1/traces
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://service-registry:8761/eureka
      REDIS_HOST: redis
    depends_on:
      - service-registry
      - redis
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 60s

  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile
    container_name: ordersphere-auth-service
    ports:
      - "8081:8081"
      - "5005:5005"
    environment:
      OTLP_TRACING_ENDPOINT: http://jaeger:4318/v1/traces
      DB_HOST: postgres
      DB_NAME: auth_db
      DB_USERNAME: ordersphere
      DB_PASSWORD: ordersphere
      ORDERS_CLIENT_SECRET: ${ORDERS_CLIENT_SECRET:-dev-orders-client-secret}
      EUREKA_URI: http://service-registry:8761/eureka
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: ordersphere
      RABBITMQ_PASSWORD: ordersphere
      JAVA_TOOL_OPTIONS: "-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005"
    depends_on:
      - postgres
      - service-registry
      - rabbitmq
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8081/actuator/health/readiness"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 60s

  inventory-service:
    build:
      context: .
      dockerfile: services/inventory-service/Dockerfile
    container_name: ordersphere-inventory-service
    ports:
      - "8083:8083"
      - "5006:5006"
    environment:
      OTLP_TRACING_ENDPOINT: http://jaeger:4318/v1/traces
      DB_HOST: postgres
      DB_NAME: inventory_db
      DB_USERNAME: ordersphere
      DB_PASSWORD: ordersphere
      JWT_JWKS_URI: http://auth-service:8081/auth/.well-known/jwks.json
      EUREKA_URI: http://service-registry:8761/eureka
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: ordersphere
      RABBITMQ_PASSWORD: ordersphere
      JAVA_TOOL_OPTIONS: "-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5006"
    depends_on:
      - postgres
      - service-registry
      - rabbitmq
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8083/actuator/health/readiness"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 60s

  ordersphere-orders:
    build:
      context: .
      dockerfile: services/ordersphere-orders/Dockerfile
    container_name: ordersphere-orders
    ports:
      - "8082:8082"
      - "5007:5007"
    environment:
      OTLP_TRACING_ENDPOINT: http://jaeger:4318/v1/traces
      DB_HOST: postgres
      DB_NAME: orders_db
      DB_USERNAME: ordersphere
      DB_PASSWORD: ordersphere
      JWT_JWKS_URI: http://auth-service:8081/auth/.well-known/jwks.json
      ORDERS_CLIENT_SECRET: ${ORDERS_CLIENT_SECRET:-dev-orders-client-secret}
      EUREKA_URI: http://service-registry:8761/eureka
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: ordersphere
      RABBITMQ_PASSWORD: ordersphere
      JAVA_TOOL_OPTIONS: "-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5007"
    depends_on:
      - postgres
      - service-registry
      - rabbitmq
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8082/actuator/health/readiness"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 60s

  payment-service:
    build:
      context: .
      dockerfile: services/payment-service/Dockerfile
    container_name: ordersphere-payment-service
    ports:
      - "8084:8084"
      - "5008:5008"
    environment:
      OTLP_TRACING_ENDPOINT: http://jaeger:4318/v1/traces
      DB_HOST: postgres
      DB_NAME: payment_db
      DB_USERNAME: ordersphere
      DB_PASSWORD: ordersphere
      JWT_JWKS_URI: http://auth-service:8081/auth/.well-known/jwks.json
      EUREKA_URI: http://service-registry:8761/eureka
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: ordersphere
      RABBITMQ_PASSWORD: ordersphere
      PAYMENT_GATEWAY_URL: http://dummy-payment-gateway:8087
      PAYMENT_GATEWAY_API_KEY: ${PAYMENT_GATEWAY_API_KEY:-dpg_test_secret_key}
      PAYMENT_GATEWAY_WEBHOOK_SECRET: ${PAYMENT_GATEWAY_WEBHOOK_SECRET:-dpg_test_webhook_secret}
      PAYMENT_WEBHOOK_URL: http://payment-service:8084/payments/webhooks/gateway
      PAYMENT_RETURN_URL: ${WEB_UI_URL:-http://localhost:5173/}
      JAVA_TOOL_OPTIONS: "-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5008"
    depends_on:
      - postgres
      - service-registry
      - rabbitmq
      - dummy-payment-gateway

  # Stand-in for an external card payment provider: hosted checkout page + merchant API.
  # Not registered in Eureka and not behind the API gateway - browsers and payment-service
  # reach it directly, as they would a real provider.
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8084/actuator/health/readiness"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 60s

  dummy-payment-gateway:
    build:
      context: .
      dockerfile: services/dummy-payment-gateway/Dockerfile
    container_name: ordersphere-dummy-payment-gateway
    ports:
      - "8087:8087"
    environment:
      GATEWAY_PUBLIC_URL: http://localhost:8087
      GATEWAY_API_KEY: ${PAYMENT_GATEWAY_API_KEY:-dpg_test_secret_key}
      GATEWAY_WEBHOOK_SECRET: ${PAYMENT_GATEWAY_WEBHOOK_SECRET:-dpg_test_webhook_secret}
      # Sessions, charges and refunds persist in gateway_db (the settlement report reads them).
      DB_HOST: postgres
      DB_NAME: gateway_db
    depends_on:
      - postgres

  shipping-service:
    build:
      context: .
      dockerfile: services/shipping-service/Dockerfile
    container_name: ordersphere-shipping-service
    ports:
      - "8085:8085"
      - "5009:5009"
    environment:
      OTLP_TRACING_ENDPOINT: http://jaeger:4318/v1/traces
      DB_HOST: postgres
      DB_NAME: shipping_db
      DB_USERNAME: ordersphere
      DB_PASSWORD: ordersphere
      JWT_JWKS_URI: http://auth-service:8081/auth/.well-known/jwks.json
      EUREKA_URI: http://service-registry:8761/eureka
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: ordersphere
      RABBITMQ_PASSWORD: ordersphere
      JAVA_TOOL_OPTIONS: "-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5009"
    depends_on:
      - postgres
      - service-registry
      - rabbitmq
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8085/actuator/health/readiness"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 60s

  notification-service:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    container_name: ordersphere-notification-service
    ports:
      - "8086:8086"
      - "5010:5010"
    environment:
      OTLP_TRACING_ENDPOINT: http://jaeger:4318/v1/traces
      DB_HOST: postgres
      DB_NAME: notification_db
      DB_USERNAME: ordersphere
      DB_PASSWORD: ordersphere
      JWT_JWKS_URI: http://auth-service:8081/auth/.well-known/jwks.json
      EUREKA_URI: http://service-registry:8761/eureka
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: ordersphere
      RABBITMQ_PASSWORD: ordersphere
      JAVA_TOOL_OPTIONS: "-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5010"
    depends_on:
      - postgres
      - service-registry
      - rabbitmq
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8086/actuator/health/readiness"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 60s

volumes:
  postgres-data:
