# Observability: logs (Alloy -> Loki), metrics (Prometheus) and Grafana for both. The files/ are copies of ../../../observability/
# (kustomize can't read outside k8s/); CI fails if they differ.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - loki.yaml
  - alloy.yaml
  - grafana.yaml
  - prometheus.yaml
configMapGenerator:
  - name: loki-config
    files:
      - loki.yaml=files/loki.yaml
  - name: alloy-config
    files:
      - config.alloy=files/config.k8s.alloy
  - name: grafana-datasources
    files:
      - files/datasources.yaml
  - name: grafana-dashboards
    files:
      - files/dashboards.yaml
      - files/ordersphere-logs.json
      - files/ordersphere-overview.json
      - files/ordersphere-services.json
  - name: prometheus-config
    files:
      - files/prometheus.yml
      - files/alerts.yml
