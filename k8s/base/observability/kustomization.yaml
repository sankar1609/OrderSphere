# Centralized logging: Alloy -> Loki -> Grafana. The files/ are copies of ../../../observability/
# (kustomize can't read outside k8s/); CI fails if they differ.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - loki.yaml
  - alloy.yaml
  - grafana.yaml
configMapGenerator:
  - name: loki-config
    files:
      - loki.yaml=files/loki.yaml
  - name: alloy-config
    files:
      - config.alloy=files/config.k8s.alloy
  - name: grafana-datasources
    files:
      - files/datasources.yaml
  - name: grafana-dashboards
    files:
      - files/dashboards.yaml
      - files/ordersphere-logs.json
