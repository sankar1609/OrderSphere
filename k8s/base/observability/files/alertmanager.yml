# Alertmanager: receives the alerts Prometheus fires (observability/prometheus/alerts.yml), groups
# and repeats them, and delivers them to notification-service, which turns each one into an in-app
# notification for the admins (the Web UI's Notifications inbox). The receiver's host is the service
# name, which is the same under docker-compose and Kubernetes, so one file serves both.
route:
  receiver: ordersphere-notifications
  # One delivery per alert and service: "ServiceDown" for two services is two notifications.
  group_by: [alertname, service]
  group_wait: 10s
  group_interval: 5m
  # A firing alert nobody has fixed is sent again after this long.
  repeat_interval: 4h

receivers:
  - name: ordersphere-notifications
    webhook_configs:
      - url: http://notification-service:8086/notifications/alerts
        send_resolved: true
        # The endpoint only answers the shared webhook token (ALERT_WEBHOOK_TOKEN): the API gateway
        # routes to every service, so it can't be open. The container's start command writes the
        # token to this file.
        http_config:
          authorization:
            credentials_file: /alertmanager/webhook-token

  # A real destination goes here (and in the route above, or a child route by severity), e.g.:
  # - name: on-call
  #   slack_configs:
  #     - api_url_file: /alertmanager/slack-webhook-url
  #       channel: '#ordersphere-alerts'
  #       send_resolved: true

inhibit_rules:
  # A service that is down also fails and slows its requests on the way; one alert is enough.
  - source_matchers: [alertname = ServiceDown]
    target_matchers: [alertname =~ "HighErrorRate|SlowResponses"]
    equal: [service]
