apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - postgres.yaml
  - rabbitmq.yaml
  - redis.yaml
  - jaeger.yaml
configMapGenerator:
  # A copy of docker/postgres-init/01-init-databases.sql (kustomize can't read files outside
  # k8s/); CI fails if the two differ.
  - name: postgres-init
    files:
      - 01-init-databases.sql=postgres-init.sql
